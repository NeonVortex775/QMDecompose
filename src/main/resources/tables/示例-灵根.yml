# ===========================================================
# 示例一：按「名字」匹配
#   一个 yml 就是一张分解表，match 决定"什么物品能分解"
#   删除本文件前请先复制一份改成你自己的
# ===========================================================

# 表 ID（用于 /qmfx list 与 info 显示，改不改都行）
id: linggen

# 表名（显示在提示里）
display: "&b灵根分解"

# 优先级：数字大的先匹配。一个物品同时符合多张表时，用优先级高的那张
priority: 10

# 每次分解消耗多少个物品（配合下面产出，1 个材料 = 1 份产出）
consume: 1

# 单次点击、单个格子最多分解多少次（防止 64 个材料一次爆出几百份产出）
max-times: 64

# ----- 什么物品能分解 -----
# 所有条件都要同时满足（AND）。可以不写某项。
match:
  # 材质，可写单个或列表，支持 WOOL:14 这种带 data 的
  # material:
  #   - DIAMOND
  #   - EMERALD

  # 名字：完全匹配；写 * 表示通配（可写多个）
  name:
    - "&b灵根*"

  # 名字包含某段文字
  # name-contains:
  #   - "灵根"

  # lore 某一整行完全等于（可写多个，全部都要有）
  # lore:
  #   - "&7可分解"

  # lore 某一整行包含（可写多个，全部都要有）
  lore-contains:
    - "可分解"

# ----- 分解后得到什么 -----
# 每一项可以给 item（物品）和/或 command（指令），两种写法可以混用
outputs:
  # 直接给物品
  - item:
      material: DIAMOND
      amount: 3
      name: "&b灵石"
      lore:
        - "&7由灵根凝炼而成"
      # 可选：给物品打 nbt（需要服务器装 NBTAPI）
      # nbt:
      #   qm_type: lingshi
  # 执行指令（%player% 会替换成玩家名）
  - command: "ni giveslient %player% 灵石 1"
    # 几率，1-100，不写默认 100
    chance: 60

  # 可以继续往下加，产出数量不受界面限制（界面只显示状态，不显示产出预览）
