# 青冥分解台 —— 龙之核心自定义界面
# 贴图：资源包 DragonCore/分解/*.png ；变量由 QingMingDecompose 插件提供（qmfx_*）
# 画布 860x366：左侧 12 个分解格 + 分解按钮，右侧玩家背包 9x3 + 快捷栏 9x1
#
# 注意：龙核按【文件名】打开界面，不是按 match 字段。
# 打开标识 = 青冥分解台，可用 /dragoncore opengui 玩家名 青冥分解台 测试。
match: "青冥分解台"
# 必须为 false：ESC 由下面的 keyPress 接管，先把格子里的东西还回背包再关界面
allowEscClose: false

Functions:
  # 界面打开后立刻同步一次变量
  open: "方法.异步执行方法('刷新变量')"
  # 客户端不知道服务端变量，必须主动向服务端拉取；面板显示期间每 500ms 拉一次
  刷新变量: |-
    方法.更新变量值('qmfx_state','qmfx_msg');
    方法.延时(500);
    方法.异步执行方法('刷新变量');
  # 按 ESC：先让服务端把格子里剩下的东西还回背包，再关界面
  keyPress: "(方法.取当前按下键=='ESCAPE')?{方法.聊天('/qmfx close');方法.延时(150);方法.关闭界面;}:0"

背景_texture:
  x: "(w-860)/2"
  y: "(h-366)/2"
  width: 860
  height: 366
  texture: "分解/背景.png"
  alpha: "方法.取界面存活时间/300"

